name: Sberkassa automatic session diagnostic

on:
  schedule:
    # 09:17 Asia/Almaty (UTC+5), once daily. This is diagnostics only.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sberkassa-automatic-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CHROMIUM_PROFILE_PASSPHRASE: ${{ secrets.CHROMIUM_PROFILE_PASSPHRASE }}
      SBERKASSA_NONINTERACTIVE: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Require encrypted profile secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CHROMIUM_PROFILE_PASSPHRASE" ]; then
            echo "Missing CHROMIUM_PROFILE_PASSPHRASE repository secret."
            exit 1
          fi

      - name: Restore encrypted Sberkassa Chromium profile
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/chromium-profile-sberkassa.gpg
          key: ${{ runner.os }}-chromium-profile-sberkassa-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-chromium-profile-sberkassa-${{ github.ref_name }}-

      - name: Install Chromium and probe dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --retries 5 --timeout 45 --break-system-packages playwright websocket-client
          python3 -m playwright install --with-deps chromium
          python3 -m py_compile scripts/sberkassa_chromium_probe.py

      - name: Restore authenticated profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/eid-chromium-profile
          ARCHIVE="${RUNNER_TEMP}/chromium-profile-sberkassa.tar.gz"
          ENCRYPTED="${RUNNER_TEMP}/chromium-profile-sberkassa.gpg"
          if [ ! -f "$ENCRYPTED" ]; then
            echo "SBERKASSA_PROFILE_CACHE=NOT_FOUND"
            echo "No saved authenticated session. Run the manual E-ID workflow once after merging this change."
            exit 1
          fi
          exec 3<<<"$CHROMIUM_PROFILE_PASSPHRASE"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --output "$ARCHIVE" --decrypt "$ENCRYPTED"
          exec 3<&-
          if tar -tzf "$ARCHIVE" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe path found in encrypted profile archive"
            exit 1
          fi
          tar -xzf "$ARCHIVE" -C /tmp/eid-chromium-profile
          rm -f "$ARCHIVE"
          echo "SBERKASSA_PROFILE_CACHE=RESTORED"

      - name: Run headless read-only freshness diagnostic
        shell: bash
        run: |
          set -euo pipefail
          CHROMIUM_BIN="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -111 | head -n 1)"
          if [ -z "$CHROMIUM_BIN" ]; then
            echo "CHROMIUM_BINARY_NOT_FOUND"
            exit 1
          fi
          "$CHROMIUM_BIN" \
            --headless=new --no-sandbox --disable-dev-shm-usage \
            --no-first-run --no-default-browser-check --password-store=basic \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --remote-allow-origins=* --user-data-dir=/tmp/eid-chromium-profile \
            --window-size=1440,900 "https://sberkassa.site/deals#tab-3" >/tmp/chromium.log 2>&1 &
          BROWSER_PID=$!
          cleanup() {
            kill -TERM "$BROWSER_PID" 2>/dev/null || true
            wait "$BROWSER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=""
          for i in $(seq 1 45); do
            if curl -fsS --connect-timeout 2 --max-time 3 http://127.0.0.1:9222/json/version >/dev/null; then
              READY=yes
              break
            fi
            if ! kill -0 "$BROWSER_PID" 2>/dev/null; then
              tail -n 80 /tmp/chromium.log || true
              exit 1
            fi
            sleep 1
          done
          if [ -z "$READY" ]; then
            echo "CHROMIUM_CDP_NOT_READY"
            tail -n 80 /tmp/chromium.log || true
            exit 1
          fi

          python3 scripts/sberkassa_chromium_probe.py >/tmp/sberkassa-probe.log 2>&1 &
          PROBE_PID=$!
          STATUS=""
          for i in $(seq 1 180); do
            STATUS="$(cat /tmp/eid-auth-status 2>/dev/null || true)"
            if [ "$STATUS" = "SBERKASSA_CAPTURE_COMPLETE" ]; then
              echo "SBERKASSA_AUTOMATED_DIAGNOSTIC=SUCCESS"
              break
            fi
            if [ "$STATUS" = "AUTH_TIMEOUT" ] || [ "$STATUS" = "SBERKASSA_CAPTURE_FAILED" ] || [ "$STATUS" = "SBERKASSA_CAPTURE_TIMEOUT" ]; then
              echo "SBERKASSA_AUTOMATED_DIAGNOSTIC=FAILED status=$STATUS"
              grep -E '^(SESSION_REUSE|EID_HANDOFF|SBERKASSA_|PAGE_UPDATE|HTTP_DIAG|REQUEST|QUOTE_FIELDS|JSON_SCHEMA)' /tmp/sberkassa-probe.log | tail -n 160 || true
              exit 1
            fi
            if ! kill -0 "$PROBE_PID" 2>/dev/null; then
              echo "SBERKASSA_PROBE_PROCESS_EXITED"
              tail -n 120 /tmp/sberkassa-probe.log || true
              exit 1
            fi
            sleep 1
          done
          if [ "$STATUS" != "SBERKASSA_CAPTURE_COMPLETE" ]; then
            echo "SBERKASSA_AUTOMATED_DIAGNOSTIC=TIMEOUT"
            tail -n 120 /tmp/sberkassa-probe.log || true
            exit 1
          fi
          wait "$PROBE_PID"
          grep -E '^(SESSION_REUSE|EID_HANDOFF|SBERKASSA_|PAGE_UPDATE|HTTP_DIAG|REQUEST|QUOTE_FIELDS|JSON_SCHEMA)' /tmp/sberkassa-probe.log | tail -n 200 || true

      - name: Encrypt refreshed authenticated profile
        if: success() && hashFiles('session-authenticated.txt') != ''
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/chromium-profile-sberkassa.tar.gz"
          ENCRYPTED="${RUNNER_TEMP}/chromium-profile-sberkassa.gpg"
          tar -czf "$ARCHIVE" -C /tmp/eid-chromium-profile .
          exec 3<<<"$CHROMIUM_PROFILE_PASSPHRASE"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 --output "$ENCRYPTED" "$ARCHIVE"
          exec 3<&-
          rm -f "$ARCHIVE"
          chmod 600 "$ENCRYPTED"
          echo "SBERKASSA_PROFILE_CACHE=ENCRYPTED"

      - name: Save refreshed encrypted profile
        if: success() && hashFiles('session-authenticated.txt') != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/chromium-profile-sberkassa.gpg
          key: ${{ runner.os }}-chromium-profile-sberkassa-${{ github.ref_name }}-${{ github.run_id }}

      - name: Publish sanitized diagnostic artifact
        if: always() && hashFiles('sberkassa-current-inspection.json') != ''
        uses: actions/upload-artifact@v5
        with:
          name: sberkassa-automatic-inspection
          path: sberkassa-current-inspection.json
          if-no-files-found: error
          retention-days: 3
