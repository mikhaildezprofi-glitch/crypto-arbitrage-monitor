name: Sberkassa RUB to USDT read-only inspection

on:
  push:
    branches:
      - feat/integrated-arbitrage-automation-20261123
      - fix/sberkassa-selectboxit-pointer-20261127
    paths:
      - .github/workflows/sberkassa-exchange-inspection.yml
      - .github/workflows/browserless-eid-handoff-stable.yml
      - scripts/sberkassa_exchange_chromium_probe.py
      - tests/test_sberkassa_exchange_probe.py
  pull_request:
    branches:
      - feat/integrated-arbitrage-automation-20261123
    paths:
      - .github/workflows/sberkassa-exchange-inspection.yml
      - .github/workflows/browserless-eid-handoff-stable.yml
      - scripts/sberkassa_exchange_chromium_probe.py
      - tests/test_sberkassa_exchange_probe.py
  workflow_dispatch:
    inputs:
      target:
        description: "Run only the exchange probe or all three authenticated tabs in one shared Chromium profile"
        required: true
        type: choice
        default: all
        options:
          - all
          - sberkassa_exchange

permissions:
  contents: read

# The called workflow receives an explicit target, independent of the caller's push event.\n# The discovery probe is GET-only and emits a sanitized artifact.\n# Wallet ids, balances, and arbitrary form values are excluded.\n# Only currency option labels are retained for pair mapping.
jobs:
  inspect-exchange-page:
    uses: ./.github/workflows/browserless-eid-handoff-stable.yml
    with:
      # Pull-request CI stays exchange-only; a manual dispatch defaults to
      # the full three-tab shared-browser collection.
      target: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'sberkassa_exchange' }}
      inspect_currency_form: false
    secrets: inherit
