name: Reusable expression smoke test

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      inspect_currency_form:
        required: false
        type: boolean
        default: false
    secrets:
      CHROMIUM_PROFILE_PASSPHRASE:
        required: true

permissions:
  contents: read

jobs:
  smoke:
    if: inputs.target == 'graph_check'
    runs-on: ubuntu-24.04
    steps:
      - name: Validate expressions from browser handoff script
        env:
          TARGET_EXPR: ${{ inputs.target != '' && inputs.target || (github.event_name == 'push' && 'sberkassa' || 'all') }}
          INSPECT_EXPR: ${{ inputs.inspect_currency_form }}
        run: |
          echo "TARGET_EXPR=$TARGET_EXPR"
          echo "INSPECT_EXPR=$INSPECT_EXPR"
