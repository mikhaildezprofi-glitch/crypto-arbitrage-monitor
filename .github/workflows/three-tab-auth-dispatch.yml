name: Three-source browser collection

on:
  # Keep the saved shared browser session warm and refresh quotes automatically.
  # If a provider invalidates its session, the run fails closed and manual E-ID is needed again.
  schedule:
    - cron: '0 4-21 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: "Refresh/check the shared session and run all three read-only collectors"
        required: true
        type: choice
        default: auth_only
        options:
          - auth_only

permissions:
  contents: read

jobs:
  collect-three-sources:
    uses: mikhaildezprofi-glitch/crypto-arbitrage-monitor/.github/workflows/browserless-eid-handoff-stable.yml@feat/three-tab-auth-only-20261128
    with:
      target: ${{ inputs.target || 'auth_only' }}
      source_ref: feat/money-storage-tom-select-auto-pair-20261128
      inspect_currency_form: false
    secrets: inherit
