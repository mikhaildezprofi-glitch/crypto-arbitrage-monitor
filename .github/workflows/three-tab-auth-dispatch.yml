name: Three-source browser collection

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Refresh/check the shared session, then collect all three read-only quotes in the same browser session"
        required: true
        type: choice
        default: auth_only
        options:
          - all
          - auth_only

permissions:
  contents: read

jobs:
  collect-three-sources:
    uses: mikhaildezprofi-glitch/crypto-arbitrage-monitor/.github/workflows/browserless-eid-handoff-stable.yml@feat/three-tab-auth-only-20261128
    with:
      target: ${{ inputs.target || 'auth_only' }}
      source_ref: feat/three-tab-auth-only-20261128
      inspect_currency_form: false
    secrets: inherit
