name: Free E-ID cloud browser (stable tunnel)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which browser workflow to run"
        required: true
        type: choice
        default: auth_only
        options:
          - auth_only
          - all
          - money_storage
          - sberkassa
          - sberkassa_exchange
      inspect_currency_form:
        description: "Keep the browser open for manual Money Storage currency-form inspection"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      target:
        description: "Which authenticated quote source to inspect"
        required: true
        type: string
      source_ref:
        description: "Git ref containing the browser scripts to execute"
        required: false
        type: string
        default: ""
      inspect_currency_form:
        description: "Keep the browser open for manual Money Storage currency-form inspection"
        required: false
        type: boolean
        default: false
      profile_cache_key:
        description: "Optional exact profile cache key; all-mode uses the latest saved profile in this branch cache namespace"
        required: false
        type: string
        default: ""
    secrets:
      CHROMIUM_PROFILE_PASSPHRASE:
        required: true
      CLOUDFLARE_TUNNEL_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  cloud-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CHROMIUM_PROFILE_PASSPHRASE: ${{ secrets.CHROMIUM_PROFILE_PASSPHRASE }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      CLOUDFLARE_TUNNEL_HOSTNAME: ${{ vars.CLOUDFLARE_TUNNEL_HOSTNAME }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Verify runner UTC clock against independent HTTPS time references
        run: python3 scripts/check_runner_clock.py
      - name: Require Chromium profile encryption secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CHROMIUM_PROFILE_PASSPHRASE" ]; then
            echo "Missing repository secret CHROMIUM_PROFILE_PASSPHRASE. Add a random passphrase of at least 32 characters in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Restore latest encrypted Chromium profile cache
        id: restore-profile
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/chromium-profile-money_storage.gpg
            ${{ runner.temp }}/chromium-profile-storage-manifest.json
          # Every all-mode run gets a unique write key. Restore falls back to
          # the newest profile in the same branch namespace, enabling rotation.
          # A caller-supplied exact key remains available for non-all diagnostics.
          key: ${{ (inputs.target == 'all' || inputs.profile_cache_key == '') && format('{0}-chromium-profile-money_storage-{1}-{2}-{3}-{4}', runner.os, github.ref_name, inputs.target || 'manual', github.run_id, github.run_attempt) || inputs.profile_cache_key }}
          restore-keys: ${{ (inputs.target == 'all' || inputs.profile_cache_key == '') && format('{0}-chromium-profile-money_storage-{1}-', runner.os, github.event.pull_request.base.ref || github.ref_name) || '' }}

      - name: Install browser and tunnel dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=8 -o Acquire::https::Timeout=45 update
          sudo apt-get -y --no-install-recommends -o Acquire::Retries=8 install \
            xvfb x11vnc novnc websockify curl x11-utils nginx apache2-utils gnupg
          python3 -m pip install --retries 5 --timeout 45 --break-system-packages playwright websocket-client
          # Download the Chromium binary, then launch it directly as a normal GUI process.
          # Playwright is not used to create, control, or automate the browser session.
          python3 -m playwright install chromium

      - name: Decrypt restored Chromium profile
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_ARCHIVE="${RUNNER_TEMP}/chromium-profile-money_storage.gpg"
          mkdir -p /tmp/eid-chromium-profile
          if [ -f "$PROFILE_ARCHIVE" ]; then
            exec 3<<<"$CHROMIUM_PROFILE_PASSPHRASE"
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
              --output "${RUNNER_TEMP}/chromium-profile-money_storage.tar.gz" \
              --decrypt "$PROFILE_ARCHIVE"
            exec 3<&-
            if tar -tzf "${RUNNER_TEMP}/chromium-profile-money_storage.tar.gz" | grep -Eq '(^/|(^|/)\\.\\.(/|$))'; then
              echo "Unsafe path found in encrypted profile archive"
              exit 1
            fi
            tar -xzf "${RUNNER_TEMP}/chromium-profile-money_storage.tar.gz" -C /tmp/eid-chromium-profile
            rm -f "${RUNNER_TEMP}/chromium-profile-money_storage.tar.gz"
            if [ -s "${RUNNER_TEMP}/chromium-profile-storage-manifest.json" ]; then
              python3 scripts/profile_storage_manifest.py compare \
                --profile-dir /tmp/eid-chromium-profile \
                --expected "${RUNNER_TEMP}/chromium-profile-storage-manifest.json" \
                --report profile-storage-restore-check.json
            else
              echo "PROFILE_STORAGE_RESTORE_CHECK=LEGACY_CACHE_WITHOUT_BASELINE"
              printf '%s\n' '{"status":"LEGACY_CACHE_WITHOUT_BASELINE"}' > profile-storage-restore-check.json
            fi
            echo "CHROMIUM_PROFILE_CACHE=RESTORED_AND_DECRYPTED"
            echo "CHROMIUM_PROFILE_RESTORED=1" >> "$GITHUB_ENV"
          else
            echo "CHROMIUM_PROFILE_CACHE=EMPTY_FIRST_AUTHENTICATION_REQUIRED"
          fi

      - name: Require the verified reference profile for collector-only runs
        if: inputs.target == 'all'
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_ARCHIVE="${RUNNER_TEMP}/chromium-profile-money_storage.gpg"
          if [ ! -s "$PROFILE_ARCHIVE" ] || [ "${CHROMIUM_PROFILE_RESTORED:-0}" != "1" ]; then
            echo "REFERENCE_PROFILE_MISSING: refusing to launch collectors without a restored encrypted profile"
            exit 1
          fi
          echo "REFERENCE_PROFILE_REQUIRED=YES"
          echo "REFERENCE_PROFILE_RESTORED=YES"
          echo "REFERENCE_PROFILE_CACHE_KEY=${{ steps.restore-profile.outputs.cache-matched-key }}"

      # All long-lived processes stay inside this step. The runner tears down
      # background processes when a step ends, which caused the earlier 1033.
      - name: Keep browser and Cloudflare tunnel alive during E-ID handoff
        shell: bash
        timeout-minutes: 35
        env:
          TARGET: ${{ inputs.target != '' && inputs.target || (github.event_name == 'push' && 'sberkassa' || 'all') }}
          INSPECT_CURRENCY_FORM: ${{ inputs.inspect_currency_form }}
          COLLECTION_EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/keep_browser_and_tunnel_alive.sh

      - name: Build sanitized per-tab collector diagnostics
        if: always() && inputs.target == 'all'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_three_tab_diagnostics.py --output-dir three-tab-collector-diagnostics

      - name: Check session_alive cookies in the closed Chromium profile
        if: always() && inputs.target == 'all' && hashFiles('three-tab-collector-diagnostics/three-tab-collector-report.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_session_alive_cookies.py \
            --profile-dir /tmp/eid-chromium-profile \
            --report session-alive-cookie-check.json

      - name: Mark all-mode profile eligible for rotation
        if: always() && inputs.target == 'all' && hashFiles('three-tab-collector-diagnostics/three-tab-collector-report.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/mark_profile_rotation_eligible.py \
            --report three-tab-collector-diagnostics/three-tab-collector-report.json \
            --cookie-report session-alive-cookie-check.json \
            --marker session-authenticated.txt

      - name: Publish per-tab collector diagnostics
        if: always() && inputs.target == 'all' && hashFiles('three-tab-collector-diagnostics/three-tab-collector-report.json') != ''
        uses: actions/upload-artifact@v5
        with:
          name: three-tab-collector-diagnostics
          path: three-tab-collector-diagnostics/
          if-no-files-found: error
          retention-days: 3

      - name: Encrypt Chromium profile for private cache
        id: encrypt-profile
        if: always() && hashFiles('session-authenticated.txt') != ''
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_ARCHIVE="${RUNNER_TEMP}/chromium-profile-money_storage.tar.gz"
          ENCRYPTED_PROFILE="${RUNNER_TEMP}/chromium-profile-money_storage.gpg"
          # The complete encrypted profile carries cookies and site storage.
          # The marker is created only after all required authentication checks pass.
          # Chromium session-restore files are optional and are not required
          # to preserve authenticated website sessions across runners.
          echo "CHROMIUM_AUTH_PROFILE_SAVE=STARTED"
          python3 scripts/profile_storage_manifest.py create \
            --profile-dir /tmp/eid-chromium-profile \
            --output "${RUNNER_TEMP}/chromium-profile-storage-manifest.json"
          # Do not carry machine-specific Chromium singleton locks into the
          # next runner's encrypted profile cache.
          rm -f -- /tmp/eid-chromium-profile/SingletonLock \
            /tmp/eid-chromium-profile/SingletonCookie \
            /tmp/eid-chromium-profile/SingletonSocket
          tar -czf "$PROFILE_ARCHIVE" -C /tmp/eid-chromium-profile .
          exec 3<<<"$CHROMIUM_PROFILE_PASSPHRASE"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 --output "$ENCRYPTED_PROFILE" "$PROFILE_ARCHIVE"
          exec 3<&-
          rm -f "$PROFILE_ARCHIVE"
          chmod 600 "$ENCRYPTED_PROFILE"
          echo "CHROMIUM_PROFILE_CACHE=ENCRYPTED"

      - name: Save encrypted Chromium profile cache
        if: steps.encrypt-profile.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/chromium-profile-money_storage.gpg
            ${{ runner.temp }}/chromium-profile-storage-manifest.json
          key: ${{ runner.os }}-chromium-profile-money_storage-${{ github.ref_name }}-${{ inputs.target || 'manual' }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish profile storage restore diagnostics
        if: always() && hashFiles('profile-storage-restore-check.json') != ''
        uses: actions/upload-artifact@v5
        with:
          name: profile-storage-restore-check
          path: |
            profile-storage-restore-check.json
            session-alive-cookie-check.json
          if-no-files-found: error
          retention-days: 3

      - name: Publish normalized current offers
        if: always() && hashFiles('money-storage-current-offers.json') != ''
        uses: actions/upload-artifact@v5
        with:
          name: money-storage-current-offers
          path: money-storage-current-offers.json
          if-no-files-found: error
          retention-days: 1

      - name: Publish Sberkassa sanitized inspection
        if: always() && hashFiles('sberkassa-current-inspection.json') != ''
        uses: actions/upload-artifact@v5
        with:
          name: sberkassa-current-inspection
          path: sberkassa-current-inspection.json
          if-no-files-found: error
          retention-days: 1

      - name: Publish Sberkassa exchange sanitized inspection
        if: always() && hashFiles('sberkassa-exchange-inspection.json') != ''
        uses: actions/upload-artifact@v5
        with:
          name: sberkassa-exchange-inspection
          path: sberkassa-exchange-inspection.json
          if-no-files-found: error
          retention-days: 1
 
      - name: Publish Sberkassa exchange DOM diagnostics
        if: always() && hashFiles('sberkassa-exchange-dom-diagnostic.json') != ''
        uses: actions/upload-artifact@v5
        with:
          name: sberkassa-exchange-dom-diagnostic
          path: sberkassa-exchange-dom-diagnostic.json
          if-no-files-found: error
          retention-days: 1

  # After the owner completes the one-time interactive E-ID handoff, verify the
  # encrypted profile in one fresh Chromium process. It must read the protected
  # offers response and pass the provider freshness check.
  # This job never opens a public remote desktop or automates CAPTCHA/E-ID/MFA.
  verify-restored-money-storage-session:
    if: inputs.target == 'money_storage'
    needs: cloud-browser
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      CHROMIUM_PROFILE_PASSPHRASE: ${{ secrets.CHROMIUM_PROFILE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v5

      - name: Restore the encrypted profile saved by the interactive job
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/chromium-profile-money_storage.gpg
          key: ${{ runner.os }}-chromium-profile-money_storage-${{ github.ref_name }}-money_storage-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Require and decrypt the authenticated profile
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/chromium-profile-money_storage.gpg"
          if [ ! -s "$ARCHIVE" ]; then
            echo "SESSION_CHECK_PROFILE_MISSING: interactive job did not publish the encrypted profile"
            exit 1
          fi
          if [ -z "$CHROMIUM_PROFILE_PASSPHRASE" ]; then
            echo "SESSION_CHECK_SECRET_MISSING"
            exit 1
          fi
          mkdir -p /tmp/eid-chromium-profile
          exec 3<<<"$CHROMIUM_PROFILE_PASSPHRASE"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --output "${RUNNER_TEMP}/chromium-profile-money_storage.tar.gz" \
            --decrypt "$ARCHIVE"
          exec 3<&-
          if tar -tzf "${RUNNER_TEMP}/chromium-profile-money_storage.tar.gz" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "SESSION_CHECK_UNSAFE_PROFILE_ARCHIVE"
            exit 1
          fi
          tar -xzf "${RUNNER_TEMP}/chromium-profile-money_storage.tar.gz" -C /tmp/eid-chromium-profile
          rm -f "${RUNNER_TEMP}/chromium-profile-money_storage.tar.gz"
          echo "SESSION_CHECK_PROFILE=RESTORED_AND_DECRYPTED"

      - name: Install headed Chromium runtime for isolated Xvfb sessions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=8 -o Acquire::https::Timeout=45 update
          sudo apt-get -y --no-install-recommends -o Acquire::Retries=8 install xvfb x11-utils gnupg
          python3 -m pip install --retries 5 --timeout 45 --break-system-packages playwright websocket-client
          python3 -m playwright install --with-deps chromium
          Xvfb :99 -screen 0 1440x900x24 -ac +extension RANDR >/tmp/session-check-xvfb.log 2>&1 &
          echo $! > /tmp/session-check-xvfb.pid
          for i in $(seq 1 30); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              echo "SESSION_CHECK_XVFB=READY"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/session-check-xvfb.log || true
          exit 1

      - name: Run one restored-session and fresh-offers check
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p session-check-results
          CHROMIUM_BIN="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -111 | head -n 1)"
          if [ -z "$CHROMIUM_BIN" ]; then
            echo "SESSION_CHECK_CHROMIUM_MISSING"
            exit 1
          fi
          for attempt in 1; do
            PROFILE_DIR="/tmp/money-storage-session-check-$attempt"
            STATUS_FILE="/tmp/money-storage-session-status-$attempt"
            LOG_FILE="session-check-results/attempt-$attempt.log"
            SNAPSHOT_FILE="$GITHUB_WORKSPACE/money-storage-current-offers.json"
            rm -rf "$PROFILE_DIR"
            rm -f "$STATUS_FILE" "$SNAPSHOT_FILE" "$GITHUB_WORKSPACE/session-authenticated.txt"
            mkdir -p "$PROFILE_DIR"
            cp -a /tmp/eid-chromium-profile/. "$PROFILE_DIR/"
            rm -f "$PROFILE_DIR/SingletonLock" "$PROFILE_DIR/SingletonCookie" "$PROFILE_DIR/SingletonSocket"
            echo "SESSION_CHECK_ATTEMPT=$attempt/1"
            DISPLAY=:99 "$CHROMIUM_BIN" \
              --no-sandbox \
              --disable-dev-shm-usage \
              --no-first-run \
              --no-default-browser-check \
              --password-store=basic \
              --remote-debugging-address=127.0.0.1 \
              --remote-debugging-port=9222 \
              --remote-allow-origins=* \
              --user-data-dir="$PROFILE_DIR" \
              --window-size=1440,900 \
              "https://storage.money/deals#tab-3" >/tmp/money-storage-session-chrome-$attempt.log 2>&1 &
            BROWSER_PID=$!
            set +e
            MONEY_STORAGE_NONINTERACTIVE=1 \
            MONEY_STORAGE_STATUS_FILE="$STATUS_FILE" \
            timeout 240s python3 scripts/money_storage_chromium_bridge.py >"$LOG_FILE" 2>&1
            RESULT=$?
            set -e
            kill -TERM "$BROWSER_PID" 2>/dev/null || true
            wait "$BROWSER_PID" 2>/dev/null || true
            STATUS="$(cat "$STATUS_FILE" 2>/dev/null || echo NO_STATUS)"
            echo "SESSION_CHECK_ATTEMPT_RESULT=$attempt status=$STATUS exit=$RESULT"
            if [ "$RESULT" -ne 0 ] || [ "$STATUS" != "OFFERS_READ_OK" ] || [ ! -s "$SNAPSHOT_FILE" ]; then
              cat "$LOG_FILE"
              echo "SESSION_CHECK_FAILED attempt=$attempt status=$STATUS"
              exit 1
            fi
            python3 - "$SNAPSHOT_FILE" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from decimal import Decimal

          with open(sys.argv[1], encoding="utf-8") as handle:
              snapshot = json.load(handle)
          if snapshot.get("source") != "money_storage" or snapshot.get("tab") != "everyone_offers":
              raise SystemExit("SESSION_CHECK_INVALID_SNAPSHOT_SOURCE")
          if snapshot.get("pair") != "USDT/ECR" or snapshot.get("freshness_confirmed") is not True:
              raise SystemExit("SESSION_CHECK_INVALID_PAIR_OR_FRESHNESS")
          count = snapshot.get("offer_count")
          if not isinstance(count, int) or not 1 <= count <= 20:
              raise SystemExit("SESSION_CHECK_INVALID_OFFER_COUNT")
          rate = Decimal(str(snapshot.get("rate", "")))
          if not rate.is_finite() or rate <= 0:
              raise SystemExit("SESSION_CHECK_INVALID_RATE")
          observed = datetime.fromisoformat(snapshot["observed_at"]).astimezone(timezone.utc)
          newest = datetime.fromisoformat(snapshot["newest_offer_created_at"]).astimezone(timezone.utc)
          age = (observed - newest).total_seconds()
          if age < 0 or age > 900:
              raise SystemExit("SESSION_CHECK_STALE_OR_FUTURE_OFFERS")
          print(f"SESSION_CHECK_QUOTE_VALID offers={count} rate={rate} newest_age_seconds={age:.1f}")
          PY
            grep -E '^(MONEY_STORAGE_SESSION=|OFFERS_READ_OK|AUTH_REQUIRED|OFFERS_READ_FAILED)' "$LOG_FILE" || true
          done
          echo "SESSION_CHECK_RESULT=1_OF_1_SUCCESS"
          {
            echo "## Money Storage restored-session verification"
            echo "- One fresh Chromium process restored the encrypted profile from the cache saved by the interactive job."
            echo "- The process read the page-originated protected Everyone Offers response for ECR -> USDT raw fields (displayed USDT -> ECR)."
            echo "- The response passed the 900-second provider create_time freshness check and the first-20 rate average validation."
            echo "- No CAPTCHA, E-ID, MFA, or login challenge was automated."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized session-check diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: money-storage-session-check-results
          path: session-check-results/
          if-no-files-found: warn
          retention-days: 3

  # A separate runner proves that the encrypted profile survives the end of the
  # interactive job and restores all three authenticated tabs in a new process.
  verify-restored-three-tab-session:
    if: inputs.target == 'auth_only'
    needs: cloud-browser
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      CHROMIUM_PROFILE_PASSPHRASE: ${{ secrets.CHROMIUM_PROFILE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Restore the encrypted profile saved by the interactive browser job
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/chromium-profile-money_storage.gpg
          key: ${{ runner.os }}-chromium-profile-money_storage-${{ github.ref_name }}-auth_only-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Decrypt and validate the saved browser profile
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/chromium-profile-money_storage.gpg"
          test -s "$ARCHIVE" || { echo "RESTORE_VERIFY_CACHE_MISSING"; exit 1; }
          mkdir -p /tmp/eid-chromium-profile
          exec 3<<<"$CHROMIUM_PROFILE_PASSPHRASE"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --output "${RUNNER_TEMP}/chromium-profile.tar.gz" --decrypt "$ARCHIVE"
          exec 3<&-
          if tar -tzf "${RUNNER_TEMP}/chromium-profile.tar.gz" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "RESTORE_VERIFY_UNSAFE_ARCHIVE"
            exit 1
          fi
          tar -xzf "${RUNNER_TEMP}/chromium-profile.tar.gz" -C /tmp/eid-chromium-profile
          rm -f "${RUNNER_TEMP}/chromium-profile.tar.gz"
          rm -f /tmp/eid-chromium-profile/SingletonLock /tmp/eid-chromium-profile/SingletonCookie /tmp/eid-chromium-profile/SingletonSocket
          echo "RESTORE_VERIFY_PROFILE=DECRYPTED"

      - name: Install Chromium and virtual display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=8 -o Acquire::https::Timeout=45 update
          sudo apt-get -y --no-install-recommends -o Acquire::Retries=8 install xvfb x11-utils gnupg
          python3 -m pip install --retries 5 --timeout 45 --break-system-packages playwright websocket-client
          python3 -m playwright install --with-deps chromium
          Xvfb :99 -screen 0 1440x900x24 -ac +extension RANDR >/tmp/restore-verify-xvfb.log 2>&1 &
          echo $! > /tmp/restore-verify-xvfb.pid
          for i in $(seq 1 30); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/restore-verify-xvfb.log || true
          exit 1

      - name: Verify restored authentication in a fresh Chromium process
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          CHROMIUM_BIN="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -111 | head -n 1)"
          test -n "$CHROMIUM_BIN"
          DISPLAY=:99 "$CHROMIUM_BIN" \
            --no-sandbox --disable-dev-shm-usage --no-first-run --no-default-browser-check \
            --password-store=basic \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --remote-allow-origins=* --user-data-dir=/tmp/eid-chromium-profile \
            --window-size=1440,900 \
            "https://storage.money/deals#tab-3" \
            "https://sberkassa.site/deals#tab-3" \
            "https://sberkassa.site/exchange" \
            >/tmp/restore-verify-chromium.log 2>&1 &
          BROWSER_PID=$!
          trap 'kill -TERM "$BROWSER_PID" 2>/dev/null || true; wait "$BROWSER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then break; fi
            sleep 1
          done
          SHARED_AUTH_TIMEOUT_SECONDS=90 SHARED_AUTH_STATUS_FILE=/tmp/restore-verify-status \
            python3 scripts/shared_browser_auth_probe.py
          test "$(cat /tmp/restore-verify-status)" = "ALL_THREE_TABS_AUTHENTICATED"
          echo "RESTORED_THREE_TAB_SESSION=VERIFIED"
          echo "RESTORED_SESSION_REQUIRES_NO_NEW_EID=YES"
