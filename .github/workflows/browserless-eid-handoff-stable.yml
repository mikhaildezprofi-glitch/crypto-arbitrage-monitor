name: Free E-ID cloud browser (stable tunnel)

on:
  push:
    branches:
      - feat/tailscale-funnel-ci-20261126
    paths:
      - .github/workflows/browserless-eid-handoff-stable.yml
  workflow_dispatch:
    inputs:
      target:
        description: "Which authenticated quote source to inspect"
        required: true
        type: choice
        default: money_storage
        options:
          - all
          - money_storage
          - sberkassa
          - sberkassa_exchange
      inspect_currency_form:
        description: "Keep the browser open for manual Money Storage currency-form inspection"
        required: false
        type: boolean
        default: false
      verify_initial_session:
        description: "Run the one-time three-read Money Storage session validation only when explicitly requested"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      target:
        description: "Which authenticated quote source to inspect"
        required: true
        type: string
      inspect_currency_form:
        description: "Keep the browser open for manual Money Storage currency-form inspection"
        required: false
        type: boolean
        default: false
      verify_initial_session:
        description: "Run the one-time three-read Money Storage session validation only when explicitly requested"
        required: false
        type: boolean
        default: false
    secrets:
      CHROMIUM_PROFILE_PASSPHRASE:
        required: true
      TAILSCALE_AUTHKEY:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  cloud-browser:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 42
    env:
      CHROMIUM_PROFILE_PASSPHRASE: ${{ secrets.CHROMIUM_PROFILE_PASSPHRASE }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify runner UTC clock against independent HTTPS time references
        run: python3 scripts/check_runner_clock.py
      - name: Require Chromium profile encryption secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CHROMIUM_PROFILE_PASSPHRASE" ]; then
            echo "Missing repository secret CHROMIUM_PROFILE_PASSPHRASE. Add a random passphrase of at least 32 characters in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Restore encrypted Chromium profile cache
        id: restore-profile
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/chromium-profile-money_storage.gpg
          key: ${{ runner.os }}-chromium-profile-money_storage-${{ github.ref_name }}-${{ inputs.target || 'manual' }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-chromium-profile-money_storage-${{ github.ref_name }}-${{ inputs.target || 'manual' }}-
            ${{ runner.os }}-chromium-profile-money_storage-${{ github.ref_name }}-

      - name: Import previously authenticated encrypted Chromium profile
        if: steps.restore-profile.outputs.cache-matched-key == ''
        uses: actions/download-artifact@v5
        with:
          name: encrypted-chromium-profile-cache-run-45688839011
          repository: mikhaildezprofi-glitch/crypto-arbitrage-monitor
          run-id: 45888939030
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/imported-chromium-profile

      - name: Install imported profile for decryption
        if: steps.restore-profile.outputs.cache-matched-key == ''
        shell: bash
        run: |
          set -euo pipefail
          source="${RUNNER_TEMP}/imported-chromium-profile/chromium-profile-money_storage.gpg"
          destination="${RUNNER_TEMP}/chromium-profile-money_storage.gpg"
          test -s "$source"
          install -m 600 "$source" "$destination"
          size="$(stat -c '%s' "$destination")"
          test "$size" -gt 1024
          rm -rf "${RUNNER_TEMP}/imported-chromium-profile"
          echo "CHROMIUM_PROFILE_IMPORT=ENCRYPTED_ARCHIVE_READY"
          echo "CHROMIUM_PROFILE_IMPORT_SIZE_BYTES=$size"

      - name: Install browser and tunnel dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=8 -o Acquire::https::Timeout=45 update
          sudo apt-get -y --no-install-recommends -o Acquire::Retries=8 install \
            xvfb x11vnc novnc websockify curl x11-utils nginx apache2-utils gnupg
          python3 -m pip install --retries 5 --timeout 45 --break-system-packages playwright websocket-client
          # Download the Chromium binary, then launch it directly as a normal GUI process.
          # Playwright is not used to create, control, or automate the browser session.
          python3 -m playwright install chromium

      - name: Decrypt restored Chromium profile
        id: decrypt-profile
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_ARCHIVE="${RUNNER_TEMP}/chromium-profile-money_storage.gpg"
          mkdir -p /tmp/eid-chromium-profile
          if [ -f "$PROFILE_ARCHIVE" ]; then
            exec 3<<<"$CHROMIUM_PROFILE_PASSPHRASE"
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
              --output "${RUNNER_TEMP}/chromium-profile-money_storage.tar.gz" \
              --decrypt "$PROFILE_ARCHIVE"
            exec 3<&-
            if tar -tzf "${RUNNER_TEMP}/chromium-profile-money_storage.tar.gz" | grep -Eq '(^/|(^|/)\\.\\.(/|$))'; then
              echo "Unsafe path found in encrypted profile archive"
              exit 1
            fi
            tar -xzf "${RUNNER_TEMP}/chromium-profile-money_storage.tar.gz" -C /tmp/eid-chromium-profile
            rm -f "${RUNNER_TEMP}/chromium-profile-money_storage.tar.gz"
            echo "CHROMIUM_PROFILE_CACHE=RESTORED_AND_DECRYPTED"
          else
            echo "CHROMIUM_PROFILE_CACHE=EMPTY_FIRST_AUTHENTICATION_REQUIRED"
          fi

      # All long-lived processes stay inside this step. The runner tears down
      # background processes when a step ends, which caused the earlier 1033.
      - name: Keep browser and Tailscale Funnel alive during E-ID handoff
        shell: bash
        timeout-minutes: 35
        env:
          TARGET: ${{ inputs.target != '' && inputs.target || 'all' }}
          INSPECT_CURRENCY_FORM: ${{ inputs.inspect_currency_form }}
          COLLECTION_EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/keep_browser_and_tunnel_alive.sh

      - name: Encrypt Chromium profile for private cache
        id: encrypt-profile
        if: always() && steps.decrypt-profile.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_ARCHIVE="${RUNNER_TEMP}/chromium-profile-money_storage.tar.gz"
          ENCRYPTED_PROFILE="${RUNNER_TEMP}/chromium-profile-money_storage.gpg"
          # Do not carry machine-specific Chromium singleton locks into the
          # next runner's encrypted profile cache.
          rm -f -- /tmp/eid-chromium-profile/SingletonLock \
            /tmp/eid-chromium-profile/SingletonCookie \
            /tmp/eid-chromium-profile/SingletonSocket
          tar -czf "$PROFILE_ARCHIVE" -C /tmp/eid-chromium-profile .
          exec 3<<<"$CHROMIUM_PROFILE_PASSPHRASE"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 --output "$ENCRYPTED_PROFILE" "$PROFILE_ARCHIVE"
          exec 3<&-
          rm -f "$PROFILE_ARCHIVE"
          chmod 600 "$ENCRYPTED_PROFILE"
          echo "CHROMIUM_PROFILE_CACHE=ENCRYPTED"

      - name: Save encrypted Chromium profile cache
        if: steps.encrypt-profile.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/chromium-profile-money_storage.gpg
          key: ${{ runner.os }}-chromium-profile-money_storage-${{ github.ref_name }}-${{ inputs.target || 'manual' }}-${{ github.run_id }}

      - name: Publish normalized current offers
        if: always() && hashFiles('money-storage-current-offers.json') != ''
        uses: actions/upload-artifact@v5
        with:
          name: money-storage-current-offers
          path: money-storage-current-offers.json
          if-no-files-found: error
          retention-days: 1

      - name: Publish Sberkassa sanitized inspection
        if: always() && hashFiles('sberkassa-current-inspection.json') != ''
        uses: actions/upload-artifact@v5
        with:
          name: sberkassa-current-inspection
          path: sberkassa-current-inspection.json
          if-no-files-found: error
          retention-days: 1

      - name: Publish Sberkassa exchange sanitized inspection
        if: always() && hashFiles('sberkassa-exchange-inspection.json') != ''
        uses: actions/upload-artifact@v5
        with:
          name: sberkassa-exchange-inspection
          path: sberkassa-exchange-inspection.json
          if-no-files-found: error
          retention-days: 1
 
      - name: Publish Sberkassa exchange DOM diagnostics
        if: always() && hashFiles('sberkassa-exchange-dom-diagnostic.json') != ''
        uses: actions/upload-artifact@v5
        with:
          name: sberkassa-exchange-dom-diagnostic
          path: sberkassa-exchange-dom-diagnostic.json
          if-no-files-found: error
          retention-days: 1

      - name: Publish shared browser session diagnostics
        if: always() && hashFiles('browser-session-diagnostics.json') != ''
        uses: actions/upload-artifact@v5
        with:
          name: browser-session-diagnostics
          path: browser-session-diagnostics.json
          if-no-files-found: error
          retention-days: 3

  # After the owner completes the one-time interactive E-ID handoff, verify the
  # encrypted profile in three independent Chromium processes. Each process
  # must read the real protected offers response and pass quote freshness checks.
  # This job never opens a public remote desktop or automates CAPTCHA/E-ID/MFA.
  verify-restored-money-storage-session:
    if: inputs.target == 'money_storage' && inputs.verify_initial_session == true
    needs: cloud-browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CHROMIUM_PROFILE_PASSPHRASE: ${{ secrets.CHROMIUM_PROFILE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v5

      - name: Restore the encrypted profile saved by the interactive job
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/chromium-profile-money_storage.gpg
          key: ${{ runner.os }}-chromium-profile-money_storage-${{ github.ref_name }}-money_storage-${{ github.run_id }}

      - name: Require and decrypt the authenticated profile
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/chromium-profile-money_storage.gpg"
          if [ ! -s "$ARCHIVE" ]; then
            echo "SESSION_CHECK_PROFILE_MISSING: interactive job did not publish the encrypted profile"
            exit 1
          fi
          if [ -z "$CHROMIUM_PROFILE_PASSPHRASE" ]; then
            echo "SESSION_CHECK_SECRET_MISSING"
            exit 1
          fi
          mkdir -p /tmp/eid-chromium-profile
          exec 3<<<"$CHROMIUM_PROFILE_PASSPHRASE"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --output "${RUNNER_TEMP}/chromium-profile-money_storage.tar.gz" \
            --decrypt "$ARCHIVE"
          exec 3<&-
          if tar -tzf "${RUNNER_TEMP}/chromium-profile-money_storage.tar.gz" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "SESSION_CHECK_UNSAFE_PROFILE_ARCHIVE"
            exit 1
          fi
          tar -xzf "${RUNNER_TEMP}/chromium-profile-money_storage.tar.gz" -C /tmp/eid-chromium-profile
          rm -f "${RUNNER_TEMP}/chromium-profile-money_storage.tar.gz"
          echo "SESSION_CHECK_PROFILE=RESTORED_AND_DECRYPTED"

      - name: Install headed Chromium runtime for isolated Xvfb sessions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=8 -o Acquire::https::Timeout=45 update
          sudo apt-get -y --no-install-recommends -o Acquire::Retries=8 install xvfb x11-utils gnupg
          python3 -m pip install --retries 5 --timeout 45 --break-system-packages playwright websocket-client
          python3 -m playwright install --with-deps chromium
          Xvfb :99 -screen 0 1440x900x24 -ac +extension RANDR >/tmp/session-check-xvfb.log 2>&1 &
          echo $! > /tmp/session-check-xvfb.pid
          for i in $(seq 1 30); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              echo "SESSION_CHECK_XVFB=READY"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/session-check-xvfb.log || true
          exit 1

      - name: Run three independent restored-session and fresh-offers checks
        shell: bash
        timeout-minutes: 18
        run: |
          set -euo pipefail
          mkdir -p session-check-results
          CHROMIUM_BIN="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -111 | head -n 1)"
          if [ -z "$CHROMIUM_BIN" ]; then
            echo "SESSION_CHECK_CHROMIUM_MISSING"
            exit 1
          fi
          for attempt in 1 2 3; do
            # Money Storage rate-limited the second independent read with HTTP 429
            # when checks were launched only seconds apart. Keep each verification
            # isolated, but leave a conservative cooldown between provider reads.
            if [ "$attempt" -gt 1 ]; then
              echo "SESSION_CHECK_COOLDOWN=120_SECONDS before attempt $attempt"
              sleep 120
            fi
            PROFILE_DIR="/tmp/money-storage-session-check-$attempt"
            STATUS_FILE="/tmp/money-storage-session-status-$attempt"
            LOG_FILE="session-check-results/attempt-$attempt.log"
            SNAPSHOT_FILE="$GITHUB_WORKSPACE/money-storage-current-offers.json"
            rm -rf "$PROFILE_DIR"
            rm -f "$STATUS_FILE" "$SNAPSHOT_FILE" "$GITHUB_WORKSPACE/session-authenticated.txt"
            mkdir -p "$PROFILE_DIR"
            cp -a /tmp/eid-chromium-profile/. "$PROFILE_DIR/"
            rm -f "$PROFILE_DIR/SingletonLock" "$PROFILE_DIR/SingletonCookie" "$PROFILE_DIR/SingletonSocket"
            echo "SESSION_CHECK_ATTEMPT=$attempt/3"
            DISPLAY=:99 "$CHROMIUM_BIN" \
              --no-sandbox \
              --disable-dev-shm-usage \
              --no-first-run \
              --no-default-browser-check \
              --password-store=basic \
              --remote-debugging-address=127.0.0.1 \
              --remote-debugging-port=9222 \
              --remote-allow-origins=* \
              --user-data-dir="$PROFILE_DIR" \
              --window-size=1440,900 \
              "https://storage.money/deals#tab-3" >/tmp/money-storage-session-chrome-$attempt.log 2>&1 &
            BROWSER_PID=$!
            set +e
            MONEY_STORAGE_NONINTERACTIVE=1 \
            MONEY_STORAGE_STATUS_FILE="$STATUS_FILE" \
            timeout 240s python3 scripts/money_storage_chromium_bridge.py >"$LOG_FILE" 2>&1
            RESULT=$?
            set -e
            kill -TERM "$BROWSER_PID" 2>/dev/null || true
            wait "$BROWSER_PID" 2>/dev/null || true
            STATUS="$(cat "$STATUS_FILE" 2>/dev/null || echo NO_STATUS)"
            echo "SESSION_CHECK_ATTEMPT_RESULT=$attempt status=$STATUS exit=$RESULT"
            if [ "$RESULT" -ne 0 ] || [ "$STATUS" != "OFFERS_READ_OK" ] || [ ! -s "$SNAPSHOT_FILE" ]; then
              cat "$LOG_FILE"
              echo "SESSION_CHECK_FAILED attempt=$attempt status=$STATUS"
              exit 1
            fi
            python3 - "$SNAPSHOT_FILE" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from decimal import Decimal

          with open(sys.argv[1], encoding="utf-8") as handle:
              snapshot = json.load(handle)
          if snapshot.get("source") != "money_storage" or snapshot.get("tab") != "everyone_offers":
              raise SystemExit("SESSION_CHECK_INVALID_SNAPSHOT_SOURCE")
          if snapshot.get("pair") != "USDT/ECR" or snapshot.get("freshness_confirmed") is not True:
              raise SystemExit("SESSION_CHECK_INVALID_PAIR_OR_FRESHNESS")
          count = snapshot.get("offer_count")
          if not isinstance(count, int) or not 1 <= count <= 20:
              raise SystemExit("SESSION_CHECK_INVALID_OFFER_COUNT")
          rate = Decimal(str(snapshot.get("rate", "")))
          if not rate.is_finite() or rate <= 0:
              raise SystemExit("SESSION_CHECK_INVALID_RATE")
          observed = datetime.fromisoformat(snapshot["observed_at"]).astimezone(timezone.utc)
          newest = datetime.fromisoformat(snapshot["newest_offer_created_at"]).astimezone(timezone.utc)
          age = (observed - newest).total_seconds()
          if age < 0 or age > 900:
              raise SystemExit("SESSION_CHECK_STALE_OR_FUTURE_OFFERS")
          print(f"SESSION_CHECK_QUOTE_VALID offers={count} rate={rate} newest_age_seconds={age:.1f}")
          PY
            grep -E '^(MONEY_STORAGE_SESSION=|OFFERS_READ_OK|AUTH_REQUIRED|OFFERS_READ_FAILED)' "$LOG_FILE" || true
          done
          echo "SESSION_CHECK_RESULT=3_OF_3_SUCCESS"
          {
            echo "## Money Storage restored-session verification"
            echo "- Three independent fresh Chromium processes restored separate copies of the encrypted profile."
            echo "- Each process read the page-originated protected Everyone Offers response for ECR -> USDT raw fields (displayed USDT -> ECR)."
            echo "- Each response passed the 900-second provider create_time freshness check and the first-20 rate average validation."
            echo "- No CAPTCHA, E-ID, MFA, or login challenge was automated."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized session-check diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: money-storage-session-check-results
          path: session-check-results/
          if-no-files-found: warn
          retention-days: 3

