name: Phone to cloud HTTPS transfer smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/https-transfer-smoke-test.yml'

permissions:
  contents: read

jobs:
  receiver:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Prepare one-use HTTPS receiver
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          cat > /tmp/receiver.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from pathlib import Path
          import hashlib, json, secrets, time

          token = secrets.token_urlsafe(24)
          Path('/tmp/receiver-token').write_text(token)

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  if self.path != '/upload/' + token:
                      self.send_error(404)
                      return
                  length = int(self.headers.get('Content-Length', '0'))
                  if length < 1 or length > 16384:
                      self.send_error(413)
                      return
                  raw = self.rfile.read(length)
                  try:
                      data = json.loads(raw)
                  except Exception:
                      self.send_error(400)
                      return
                  if data.get('test') != 'phone-to-cloud-smoke-test':
                      self.send_error(422)
                      return
                  digest = hashlib.sha256(raw).hexdigest()
                  body = json.dumps({'received': True, 'sha256': digest}).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
                  print('PHONE_HTTPS_PAYLOAD_RECEIVED=PASS', flush=True)
                  print('PAYLOAD_BYTES=' + str(len(raw)), flush=True)
                  print('PAYLOAD_SHA256=' + digest, flush=True)
                  self.server.received = True
              def log_message(self, fmt, *args):
                  pass

          server = HTTPServer(('127.0.0.1', 8765), Handler)
          server.received = False
          deadline = time.monotonic() + 600
          while not server.received and time.monotonic() < deadline:
              server.timeout = min(30, max(1, deadline - time.monotonic()))
              server.handle_request()
          if not server.received:
              print('PHONE_HTTPS_PAYLOAD_RECEIVED=TIMEOUT', flush=True)
              raise SystemExit(2)
          PY
          nohup python3 /tmp/receiver.py >/tmp/receiver.log 2>&1 </dev/null &
          echo $! > /tmp/receiver.pid
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8765 >/tmp/cloudflared.log 2>&1 </dev/null &
          echo $! > /tmp/cloudflared.pid
          URL=''
          for i in $(seq 1 60); do
            URL="$(grep -Eo 'https://[[:alnum:].-]+[.]trycloudflare[.]com' /tmp/cloudflared.log | head -n 1 || true)"
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo 'Could not start temporary HTTPS tunnel.'
            tail -n 30 /tmp/cloudflared.log
            exit 1
          fi
          TOKEN="$(cat /tmp/receiver-token)"
          COMMAND="curl -fsS --max-time 30 -X POST '$URL/upload/$TOKEN' -H 'Content-Type: application/json' --data-binary '{\\"test\\":\\"phone-to-cloud-smoke-test\\",\\"source\\":\\"termux\\",\\"value\\":123}'"
          printf '%s\\n' "$COMMAND" > /tmp/connection.txt
          {
            echo '## Одноразовый HTTPS-приёмник для телефона'
            echo
            echo "Адрес: $URL/upload/$TOKEN"
            echo
            echo 'Команду отправки можно взять из артефакта phone-https-connection.'
            echo 'Приёмник ждёт один запрос до 10 минут. Только тестовый JSON, без cookies и токенов аккаунта.'
            echo
            echo "$COMMAND"
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'TEMPORARY_RECEIVER_READY=1'
          if ! kill -0 "$(cat /tmp/receiver.pid)" 2>/dev/null; then
            cat /tmp/receiver.log || true
            echo 'Receiver did not remain alive after startup.'
            exit 1
          fi

      - name: Upload one-use connection command
        uses: actions/upload-artifact@v4
        with:
          name: phone-https-connection
          path: /tmp/connection.txt
          retention-days: 1

      - name: Wait for phone HTTPS request
        shell: bash
        run: |
          set -euo pipefail
          echo 'Waiting up to 10 minutes for the phone request.'
          for i in $(seq 1 620); do
            if grep -q 'PHONE_HTTPS_PAYLOAD_RECEIVED=PASS' /tmp/receiver.log 2>/dev/null; then
              cat /tmp/receiver.log
              echo 'PHONE_TO_CLOUD_HTTPS_TEST=PASS'
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/receiver.pid)" 2>/dev/null; then
              cat /tmp/receiver.log || true
              echo 'Receiver stopped before the phone request was accepted.'
              exit 1
            fi
            sleep 1
          done
          cat /tmp/receiver.log || true
          echo 'PHONE_TO_CLOUD_HTTPS_TEST=TIMEOUT'
          exit 1
