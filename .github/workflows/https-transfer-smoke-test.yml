name: Temporary HTTPS transfer smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/https-transfer-smoke-test.yml'

permissions:
  contents: read

jobs:
  receiver:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Start one-use HTTPS receiver
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/receiver.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from pathlib import Path
          import hashlib, json, secrets

          token = secrets.token_urlsafe(24)
          Path('/tmp/receiver-token').write_text(token)

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  if self.path != '/upload/' + token:
                      self.send_error(404)
                      return
                  length = int(self.headers.get('Content-Length', '0'))
                  if length < 1 or length > 16384:
                      self.send_error(413)
                      return
                  raw = self.rfile.read(length)
                  try:
                      data = json.loads(raw)
                  except Exception:
                      self.send_error(400)
                      return
                  if data.get('test') != 'https-transfer-smoke-test':
                      self.send_error(422)
                      return
                  digest = hashlib.sha256(raw).hexdigest()
                  body = json.dumps({'received': True, 'sha256': digest}).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
                  print('HTTPS_PAYLOAD_RECEIVED=PASS', flush=True)
                  print('PAYLOAD_BYTES=' + str(len(raw)), flush=True)
                  print('PAYLOAD_SHA256=' + digest, flush=True)
                  self.server.received = True
              def log_message(self, fmt, *args):
                  pass
          server = HTTPServer(('127.0.0.1', 8765), Handler)
          server.received = False
          while not server.received:
              server.handle_request()
          PY
          python3 /tmp/receiver.py >/tmp/receiver.log 2>&1 &
          echo $! > /tmp/receiver.pid
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8765 >/tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid
          URL=''
          for i in $(seq 1 60); do
            URL="$(grep -Eo 'https://[[:alnum:].-]+[.]trycloudflare[.]com' /tmp/cloudflared.log | head -n 1 || true)"
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo 'Could not start temporary HTTPS tunnel.'
            tail -n 30 /tmp/cloudflared.log
            exit 1
          fi
          TOKEN="$(cat /tmp/receiver-token)"
          {
            echo '## Одноразовый HTTPS-приёмник'
            echo
            echo "Адрес: $URL/upload/$TOKEN"
            echo
            echo 'Отправляй только тестовый JSON. Не отправляй cookies, токены или реальные данные аккаунта.'
            echo
            echo 'Команда для Termux:'
            echo "curl -fsS -X POST '$URL/upload/$TOKEN' -H 'Content-Type: application/json' --data '{\"test\":\"https-transfer-smoke-test\",\"source\":\"termux\",\"value\":123}'"
            echo
            echo 'Приёмник одноразовый и завершится после одного корректного запроса.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'Temporary HTTPS receiver ready. Use the command in the workflow summary.'
          for i in $(seq 1 600); do
            if grep -q 'HTTPS_PAYLOAD_RECEIVED=PASS' /tmp/receiver.log 2>/dev/null; then
              cat /tmp/receiver.log
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/receiver.pid)" 2>/dev/null; then break; fi
            sleep 1
          done
          echo 'Receiver timed out or stopped before receiving the test payload.'
          exit 1
        env:
          PYTHONUNBUFFERED: '1'
