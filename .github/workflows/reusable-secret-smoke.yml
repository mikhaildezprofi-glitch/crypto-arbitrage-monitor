name: Reusable workflow secret smoke test

on:
  workflow_call:
    secrets:
      CHROMIUM_PROFILE_PASSPHRASE:
        required: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm inherited required secret is present without revealing it
        env:
          PASSPHRASE: ${{ secrets.CHROMIUM_PROFILE_PASSPHRASE }}
        run: |
          test -n "$PASSPHRASE"
          echo "REQUIRED_SECRET_INHERIT=OK"
