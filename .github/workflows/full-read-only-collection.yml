name: Full read-only five-source collection

on:
  workflow_dispatch:
  push:
    branches:
      - feat/integrated-arbitrage-automation-20261123
    paths:
      - .github/workflows/full-read-only-collection.yml
      - scripts/run_full_collection.py
      - src/arbitrage_monitor/providers/**

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run all five providers in strict read-only mode
        id: collection
        shell: bash
        env:
          PYTHONPATH: src
          QUOTE_MAX_AGE_SECONDS: "900"
          FULL_COLLECTION_REPORT_PATH: full-collection-report.json
          WINANCE_POLL_SECONDS: "3600"
        run: |
          set +e
          python scripts/run_full_collection.py
          result=$?
          echo "collector_exit_code=$result" >> "$GITHUB_OUTPUT"
          if [ -f full-collection-report.json ]; then
            echo "REPORT_CREATED=yes" >> "$GITHUB_STEP_SUMMARY"
          fi
          # A partial source set is a valid diagnostic outcome, not a successful route.
          exit 0
      - name: Publish sanitized full collection report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: full-read-only-collection-report
          path: full-collection-report.json
          if-no-files-found: error
          retention-days: 3
      - name: Summarize route eligibility
        if: always()
        shell: bash
        run: |
          echo "Collector exit code: ${{ steps.collection.outputs.collector_exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "No route calculation is performed unless all five fresh quotes and all applicable fees are available." >> "$GITHUB_STEP_SUMMARY"
          echo "No exchange, order, deposit, withdrawal, transfer, or submit action is permitted." >> "$GITHUB_STEP_SUMMARY"
