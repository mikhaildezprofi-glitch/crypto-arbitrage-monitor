name: Manual full read-only five-source collection (one shared Chromium, three tabs)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Select the collection target"
        required: true
        type: choice
        options:
          - all
        default: all
      inspect_currency_form:
        description: "Inspect the currency form (kept false for the integrated run)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: full-read-only-collection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shared-authenticated-browser:
    uses: ./.github/workflows/browserless-eid-handoff-stable.yml
    with:
      target: all
      inspect_currency_form: false
    secrets: inherit

  collect:
    needs: [shared-authenticated-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download current Money Storage snapshot from this run
        uses: actions/download-artifact@v4
        with:
          name: money-storage-current-offers
          path: .
      - name: Download current Sberkassa ERUB to RUB snapshot from this run
        uses: actions/download-artifact@v4
        with:
          name: sberkassa-current-inspection
          path: .
      - name: Download current Sberkassa RUB to USDT snapshot from this run
        uses: actions/download-artifact@v4
        with:
          name: sberkassa-exchange-inspection
          path: .
      - name: Install project runtime dependencies
        run: python -m pip install --disable-pip-version-check .
      - name: Run all five providers and normalized route validation
        id: collection
        shell: bash
        env:
          PYTHONPATH: src
          QUOTE_MAX_AGE_SECONDS: "900"
          FULL_COLLECTION_REPORT_PATH: full-collection-report.json
        run: |
          set +e
          python scripts/run_full_collection.py
          result=$?
          echo "collector_exit_code=$result" >> "$GITHUB_OUTPUT"
          echo "REPORT_CREATED=$(test -f full-collection-report.json && echo yes || echo no)" >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Publish sanitized full collection report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: full-read-only-collection-report
          path: full-collection-report.json
          if-no-files-found: warn
          retention-days: 3
      - name: Summarize route eligibility
        if: always()
        shell: bash
        run: |
          echo "Collector exit code: ${{ steps.collection.outputs.collector_exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "A complete result is a normalized pre-fee estimate. All five fee defaults are temporary 0% placeholders, not claims about provider fees; net profit remains uncalculated until manual fees are configured." >> "$GITHUB_STEP_SUMMARY"
          echo "No exchange, order, deposit, withdrawal, transfer, or submit action is permitted." >> "$GITHUB_STEP_SUMMARY"
