name: Free E-ID cloud browser

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-eid-cloud-browser
  cancel-in-progress: true

jobs:
  cloud-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install temporary browser and remote display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify curl x11-utils
          python3 -m pip install --break-system-packages playwright
          python3 -m playwright install --with-deps chromium

      - name: Start protected remote browser
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          # VNC's classic password authentication uses only the first 8 characters.
          VNC_PASSWORD="$(python3 -c 'import secrets,string; print("".join(secrets.choice(string.ascii_letters + string.digits) for _ in range(8)))')"
          printf '%s' "$VNC_PASSWORD" > /tmp/eid-vnc-password

          Xvfb :99 -screen 0 1440x900x24 -ac +extension RANDR >/tmp/xvfb.log 2>&1 &
          echo $! >/tmp/xvfb.pid
          for i in $(seq 1 30); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null

          x11vnc -display :99 -rfbport 5900 -forever -shared -repeat -noxdamage -passwd "$VNC_PASSWORD" >/tmp/x11vnc.log 2>&1 &
          echo $! >/tmp/x11vnc.pid

          websockify --web=/usr/share/novnc 6080 127.0.0.1:5900 >/tmp/websockify.log 2>&1 &
          echo $! >/tmp/websockify.pid

          cat >/tmp/launch_eid_browser.py <<'PY'
          import time
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=False,
                  args=["--no-sandbox", "--disable-dev-shm-usage", "--start-maximized"]
              )
              context = browser.new_context(viewport={"width": 1440, "height": 900})
              page = context.new_page()
              page.goto("https://e-id.cards/login", wait_until="domcontentloaded", timeout=60000)
              print("E-ID page loaded. Browser will remain open for the handoff window.", flush=True)
              time.sleep(1800)
              browser.close()
          PY

          DISPLAY=:99 nohup python3 /tmp/launch_eid_browser.py >/tmp/eid-browser.log 2>&1 &
          echo $! >/tmp/eid-browser.pid

          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:6080 >/tmp/cloudflared.log 2>&1 &
          echo $! >/tmp/cloudflared.pid

          TUNNEL_URL=""
          for i in $(seq 1 60); do
            TUNNEL_URL="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)"
            if [ -n "$TUNNEL_URL" ]; then break; fi
            if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
              echo "Cloudflare Quick Tunnel stopped unexpectedly."
              tail -n 30 /tmp/cloudflared.log
              exit 1
            fi
            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "Could not obtain the temporary Cloudflare URL."
            tail -n 30 /tmp/cloudflared.log
            exit 1
          fi

          if ! curl -fsS --max-time 15 http://127.0.0.1:6080/vnc.html >/dev/null; then
            echo "noVNC web interface did not become ready."
            exit 1
          fi

          {
            echo "# Временный облачный браузер E-ID"
            echo
            echo "**Сессия доступна примерно 30 минут с момента появления этой ссылки.**"
            echo
            echo "1. Открой ссылку ниже в Chrome на телефоне."
            echo "2. Нажми Connect, если подключение не началось автоматически."
            echo "3. Введи пароль удалённого экрана из этого Summary."
            echo "4. Управляй браузером E-ID внутри удалённого экрана. Ссылка подтверждения должна открываться в этом же браузере."
            echo
            echo "**Пароль удалённого экрана:** `$VNC_PASSWORD`"
            echo
            echo "[Открыть облачный браузер]($TUNNEL_URL/vnc.html?autoconnect=true&resize=scale&quality=6&compression=2)"
            echo
            echo "> Ссылка и пароль дают доступ к активной браузерной сессии. Не пересылай их и не публикуй. Не вводи пароль E-ID в GitHub."
            echo
            echo "После завершения закрой эту страницу. Облачный компьютер автоматически остановится по окончании окна сессии."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Temporary remote browser is ready. Connection details are only in the private workflow summary."

      - name: Keep the browser available for manual E-ID confirmation
        shell: bash
        run: |
          echo "The temporary browser remains available for up to 30 minutes."
          sleep 1800

      - name: Stop temporary browser services
        if: always()
        shell: bash
        run: |
          for file in /tmp/eid-browser.pid /tmp/websockify.pid /tmp/x11vnc.pid /tmp/xvfb.pid /tmp/cloudflared.pid; do
            if [ -f "$file" ]; then
              kill "$(cat "$file")" 2>/dev/null || true
            fi
          done
          rm -f /tmp/eid-vnc-password
