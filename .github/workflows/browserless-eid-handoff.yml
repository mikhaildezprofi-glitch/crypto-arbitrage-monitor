name: Free E-ID cloud browser

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-eid-cloud-browser
  cancel-in-progress: true

jobs:
  cloud-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install temporary browser and remote display
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's Ubuntu image may configure mirror+file sources that select
          # an unstable regional endpoint. Use the canonical Ubuntu mirrors.
          sudo python3 - <<'PY'
          from pathlib import Path

          source_dir = Path("/etc/apt/sources.list.d")
          for path in source_dir.glob("*.sources"):
              text = path.read_text()
              if "mirror+file:/etc/apt/apt-mirrors.txt" not in text:
                  continue
              stanzas = []
              for stanza in text.strip().split("\n\n"):
                  if not stanza.strip():
                      continue
                  suites = ""
                  for line in stanza.splitlines():
                      if line.lower().startswith("suites:"):
                          suites = line.split(":", 1)[1].strip()
                  uri = ("https://security.ubuntu.com/ubuntu/"
                         if "security" in suites
                         else "https://archive.ubuntu.com/ubuntu/")
                  stanza = stanza.replace(
                      "mirror+file:/etc/apt/apt-mirrors.txt", uri
                  )
                  stanzas.append(stanza)
              path.write_text("\n\n".join(stanzas) + "\n")
              print(f"Reconfigured Ubuntu mirror source: {path}")

          PY
          APT_OPTS=(
            -o Acquire::Retries=8
            -o Acquire::http::Timeout=45
            -o Acquire::https::Timeout=45
            -o Acquire::http::Pipeline-Depth=0
            -o Acquire::https::Pipeline-Depth=0
          )
          sudo apt-get "${APT_OPTS[@]}" update
          install_ok=""
          for attempt in 1 2 3; do
            if sudo apt-get -y --no-install-recommends "${APT_OPTS[@]}" install \
              xvfb x11vnc novnc websockify curl x11-utils nginx apache2-utils; then
              install_ok="yes"
              break
            fi
            echo "Ubuntu package installation attempt $attempt/3 failed; refreshing package indexes before retry."
            sleep 15
            sudo apt-get "${APT_OPTS[@]}" update
          done
          if [ -z "$install_ok" ]; then
            echo "Required browser packages could not be installed after three attempts."
            exit 1
          fi
          python3 -m pip install --retries 5 --timeout 45 --break-system-packages playwright
          # Avoid Playwright's --with-deps path: it launches a second apt
          # transaction and reintroduces the same mirror/socket failure.
          python3 -m playwright install chromium

      - name: Start protected remote browser
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          # VNC's classic password authentication uses only the first 8 characters.
          VNC_PASSWORD="$(python3 -c 'import secrets,string; print("".join(secrets.choice(string.ascii_letters + string.digits) for _ in range(8)))')"
          HTTP_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(36))')"
          printf '%s' "$VNC_PASSWORD" > /tmp/eid-vnc-password
          printf '%s' "$HTTP_PASSWORD" > /tmp/eid-http-password
          sudo htpasswd -Bbn viewer "$HTTP_PASSWORD" | sudo tee /etc/nginx/eid.htpasswd >/dev/null
          sudo chown root:www-data /etc/nginx/eid.htpasswd
          sudo chmod 640 /etc/nginx/eid.htpasswd
          sudo tee /etc/nginx/sites-available/eid-browser >/dev/null <<'NGINX'
          map $http_upgrade $connection_upgrade {
            default upgrade;
            '' close;
          }
          server {
            listen 8080;
            server_name _;
            location / {
              auth_basic "Private E-ID browser";
              auth_basic_user_file /etc/nginx/eid.htpasswd;
              proxy_pass http://127.0.0.1:6080;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_set_header Host $host;
            }
          }
          NGINX
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo ln -s /etc/nginx/sites-available/eid-browser /etc/nginx/sites-enabled/eid-browser
          sudo nginx -t
          sudo nginx

          Xvfb :99 -screen 0 1440x900x24 -ac +extension RANDR >/tmp/xvfb.log 2>&1 &
          echo $! >/tmp/xvfb.pid
          for i in $(seq 1 30); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null

          x11vnc -display :99 -rfbport 5900 -forever -shared -repeat -noxdamage -passwd "$VNC_PASSWORD" >/tmp/x11vnc.log 2>&1 &
          echo $! >/tmp/x11vnc.pid

          websockify --web=/usr/share/novnc 6080 127.0.0.1:5900 >/tmp/websockify.log 2>&1 &
          echo $! >/tmp/websockify.pid

          cat >/tmp/launch_eid_browser.py <<'PY'
          import time
          import os, sys, json
          from pathlib import Path
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright
          sys.path.insert(0, str(Path.cwd()))
          sys.path.insert(0, str(Path.cwd() / "src"))
          from scripts.money_storage_cloud_read import (\n    TransientMoneyStorageReadError,\n    fetch_from_authenticated_page,\n    write_normalized_snapshot,\n)

          status_file = Path("/tmp/eid-auth-status")
          status_file.write_text("WAITING_FOR_LOGIN", encoding="utf-8")

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=False,
                  args=["--no-sandbox", "--disable-dev-shm-usage", "--start-maximized"]
              )
              # Keep standard browser security and web features enabled explicitly.
              context = browser.new_context(
                  viewport={"width": 1440, "height": 900},
                  java_script_enabled=True,
                  accept_downloads=False
              )
              page = context.new_page()

              # Diagnostics only: log Cloudflare resource failures without query strings,
              # cookies, challenge tokens, or other sensitive values.
              def safe_resource_label(url):
                  parsed = urlparse(url)
                  return parsed.netloc + parsed.path

              def on_request_failed(request):
                  parsed = urlparse(request.url)
                  host = (parsed.hostname or "").lower()
                  if "cloudflare" in host or host.endswith(".cloudflare.com") or host.endswith(".cloudflareinsights.com"):
                      print("CLOUDFLARE_RESOURCE_FAILED=%s failure=%s" % (
                          safe_resource_label(request.url),
                          (request.failure or "unknown")[:160]
                      ), flush=True)

              def on_response(response):
                  parsed = urlparse(response.url)
                  host = (parsed.hostname or "").lower()
                  if response.status >= 400 and ("cloudflare" in host or host.endswith(".cloudflare.com") or host.endswith(".cloudflareinsights.com")):
                      print("CLOUDFLARE_RESOURCE_HTTP_ERROR=%s status=%s" % (
                          safe_resource_label(response.url), response.status
                      ), flush=True)

              page.on("requestfailed", on_request_failed)
              page.on("response", on_response)
              page.on("pageerror", lambda error: print("BROWSER_PAGE_ERROR=%s" % str(error)[:200], flush=True))

              def on_main_frame_navigation(frame):
                  if frame == page.main_frame:
                      parsed = urlparse(frame.url)
                      # Never log query strings or fragments: OAuth state and codes may be present.
                      print("MAIN_FRAME_NAVIGATION=%s%s" % (parsed.netloc, parsed.path), flush=True)

              page.on("framenavigated", on_main_frame_navigation)

              # Start at the protected Money Storage cabinet. Its own login flow must
              # establish OAuth state and redirect to the E-ID login form. Do not open
              # the E-ID endpoint directly and do not start on the public deals page.
              page.goto(
                  "https://storage.money/account",
                  wait_until="domcontentloaded",
                  timeout=60000
              )
              browser_checks = page.evaluate("""() => {
                  const jsWorks = typeof window === "object" && typeof document === "object";
                  const cookieName = "__eid_browser_cookie_test";
                  document.cookie = cookieName + "=1; path=/; SameSite=Lax";
                  const cookiesWork = document.cookie.split(";").some(item => item.trim() === cookieName + "=1");
                  document.cookie = cookieName + "=; Max-Age=0; path=/; SameSite=Lax";
                  return {javascript: jsWorks, firstPartyCookieWriteRead: cookiesWork};
              }""")
              print("BROWSER_FEATURE_CHECKS=%s" % json.dumps(browser_checks, sort_keys=True), flush=True)
              print("Money Storage account entry opened; waiting for its E-ID login redirect.", flush=True)
              print("INITIAL_URL=%s" % urlparse(page.url).netloc + urlparse(page.url).path, flush=True)

              deadline = time.monotonic() + 1800
              authenticated = False
              while time.monotonic() < deadline:
                  try:
                      current = urlparse(page.url)
                      if current.scheme == "https" and current.netloc.lower() == "storage.money" and current.path.rstrip("/") == "/account":
                          print("AUTH_STATUS=ACCOUNT_REACHED", flush=True)
                          authenticated = True
                          try:
                              page.goto("https://storage.money/deals#tab-3", wait_until="domcontentloaded", timeout=60000)
                              snapshot = None
                              for attempt in range(1, 4):
                                  try:
                                      snapshot = fetch_from_authenticated_page(page)
                                      break
                                  except TransientMoneyStorageReadError as error:
                                      print("OFFERS_READ_TRANSIENT_FAILURE attempt=%s/3 reason=%s" % (
                                          attempt, str(error)[:180]
                                      ), flush=True)
                                      if attempt == 3:
                                          raise
                                      time.sleep(3 * attempt)
                              if snapshot is None:
                                  raise RuntimeError("Money Storage read produced no snapshot.")
                              write_normalized_snapshot(snapshot, str(Path(os.environ["GITHUB_WORKSPACE"]) / "money-storage-current-offers.json"))
                              status_file.write_text("OFFERS_READ_OK", encoding="utf-8")
                              summary = [
                                  "", "## Money Storage: актуальные предложения «Всем предлагают»", "",
                                  f"- Статус: успешно прочитано в облачном браузере",
                                  f"- Предложений: {snapshot['offer_count']}",
                                  f"- Средний курс USDT → ECR: **{snapshot['rate']} ECR за 1 USDT**",
                                  f"- Время наблюдения UTC: {snapshot['observed_at']}",
                                  "- Комиссия не учитывалась; история не сохранялась.",
                                  "- Сессионные cookies, токены и исходный ответ API не экспортировались.", ""
                              ]
                              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
                                  output.write("\n".join(summary))
                              print("OFFERS_READ_OK count=%s mean_rate=%s" % (snapshot['offer_count'], snapshot['rate']), flush=True)
                          except Exception as error:
                              status_file.write_text("OFFERS_READ_FAILED", encoding="utf-8")
                              if isinstance(error, (RuntimeError, ValueError, TypeError)):
                                  print("OFFERS_READ_FAILED=%s reason=%s" % (
                                      type(error).__name__, str(error)[:240]
                                  ), flush=True)
                              else:
                                  print("OFFERS_READ_FAILED=%s" % type(error).__name__, flush=True)
                          break
                  except Exception:
                      pass
                  time.sleep(2)

              if not authenticated:
                  status_file.write_text("TIMEOUT_NOT_RETURNED_TO_ACCOUNT", encoding="utf-8")
                  print("AUTH_STATUS=TIMEOUT_NOT_RETURNED_TO_ACCOUNT", flush=True)

              # Keep the browser open for the remaining handoff window.
              time.sleep(max(0, deadline - time.monotonic()))
              browser.close()
          PY

          DISPLAY=:99 nohup python3 /tmp/launch_eid_browser.py >/tmp/eid-browser.log 2>&1 &
          echo $! >/tmp/eid-browser.pid

          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 >/tmp/cloudflared.log 2>&1 &
          echo $! >/tmp/cloudflared.pid

          TUNNEL_URL=""
          for i in $(seq 1 60); do
            TUNNEL_URL="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)"
            if [ -n "$TUNNEL_URL" ]; then break; fi
            if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
              echo "Cloudflare Quick Tunnel stopped unexpectedly."
              tail -n 30 /tmp/cloudflared.log
              exit 1
            fi
            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "Could not obtain the temporary Cloudflare URL."
            tail -n 30 /tmp/cloudflared.log
            exit 1
          fi

          BACKEND_READY=""
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:6080/vnc.html -o /dev/null; then
              BACKEND_READY="yes"
              break
            fi
            sleep 2
          done
          if [ -z "$BACKEND_READY" ]; then
            echo "noVNC backend on port 6080 did not become ready."
            echo "--- websockify log ---"
            tail -n 60 /tmp/websockify.log || true
            echo "--- x11vnc log ---"
            tail -n 40 /tmp/x11vnc.log || true
            echo "--- nginx error log ---"
            sudo tail -n 60 /var/log/nginx/error.log || true
            exit 1
          fi

          PROXY_READY=""
          for i in $(seq 1 30); do
            HTTP_CODE="$(curl -sS --max-time 5 -u "viewer:$HTTP_PASSWORD" -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/vnc.html || true)"
            if [ "$HTTP_CODE" = "200" ]; then
              PROXY_READY="yes"
              break
            fi
            echo "Waiting for protected noVNC proxy (HTTP code: $HTTP_CODE, attempt $i/30)."
            sleep 2
          done
          if [ -z "$PROXY_READY" ]; then
            echo "Protected noVNC proxy did not become ready."
            echo "--- websockify log ---"
            tail -n 60 /tmp/websockify.log || true
            echo "--- nginx error log ---"
            sudo tail -n 60 /var/log/nginx/error.log || true
            exit 1
          fi

          BROWSER_READY=""
          for i in $(seq 1 60); do
            if grep -q "Money Storage account entry opened; waiting for its E-ID login redirect." /tmp/eid-browser.log; then
              BROWSER_READY="yes"
              break
            fi
            if ! kill -0 "$(cat /tmp/eid-browser.pid)" 2>/dev/null; then
              echo "Chromium exited before the Money Storage entry page was ready."
              cat /tmp/eid-browser.log
              exit 1
            fi
            sleep 2
          done
          if [ -z "$BROWSER_READY" ]; then
            echo "Chromium did not confirm that the Money Storage account entry page loaded."
            tail -n 30 /tmp/eid-browser.log
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/.artifacts/eid-browser-connection"
          {
            echo "ВРЕМЕННЫЙ ОБЛАЧНЫЙ БРАУЗЕР E-ID"
            echo
            echo "Ссылка для подключения:"
            echo "$TUNNEL_URL/vnc.html?autoconnect=true&resize=scale&quality=6&compression=2"
            echo
            echo "HTTP-логин: viewer"
            echo "HTTP-пароль доступа:"
            echo "$HTTP_PASSWORD"
            echo
            echo "Пароль VNC (внутри noVNC):"
            echo "$VNC_PASSWORD"
            echo
            echo "Сессия доступна примерно 30 минут. Ссылка и оба пароля дают доступ к активной сессии. Не пересылай их."
            echo "Перед noVNC включена HTTP Basic Auth защита с длинным случайным паролем. Сам VNC-протокол всё равно ограничивает пароль восемью символами."
            echo "Вводи данные E-ID только на сайте e-id.cards внутри удалённого браузера."
            echo "Ссылку подтверждения открывай в этом же удалённом браузере."
            echo "Для вставки ссылки используй Clipboard в панели noVNC; если не работает, открой ссылку подтверждения вручную через адресную строку удалённого браузера."
          } > "$GITHUB_WORKSPACE/.artifacts/eid-browser-connection/CONNECTION.txt"
          chmod 600 "$GITHUB_WORKSPACE/.artifacts/eid-browser-connection/CONNECTION.txt"
          test -s "$GITHUB_WORKSPACE/.artifacts/eid-browser-connection/CONNECTION.txt"

          {
            echo "# Временный облачный браузер E-ID"
            echo
            echo "**Браузер запущен. Сессия доступна примерно 30 минут.**"
            echo
            echo "Данные подключения приложены к этому запуску отдельным файлом `CONNECTION.txt` (раздел Artifacts). Скачай артефакт `eid-browser-connection` и открой файл."
            echo
            echo "Не публикуй и не пересылай файл: он содержит временный адрес и два пароля удалённого экрана."
            echo
            echo "Вводи данные E-ID только внутри удалённого браузера. Ссылку подтверждения открывай в той же удалённой сессии."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Temporary remote browser is ready."

      - name: Publish private connection details
        id: connection
        uses: actions/upload-artifact@v5
        with:
          name: eid-browser-connection
          path: .artifacts/eid-browser-connection/CONNECTION.txt
          if-no-files-found: error
          retention-days: 1

      - name: Add artifact location to run summary
        if: success()
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.connection.outputs.artifact-url }}
        run: |
          {
            echo
            echo "**Файл подключения:** [Скачать CONNECTION.txt]($ARTIFACT_URL)"
            echo
            echo "Открой скачанный файл на телефоне. В нём находятся адрес облачного браузера и пароль экрана."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for Money Storage account redirect
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for E-ID login and one authenticated read of Everyone Offers."
          for i in $(seq 1 900); do
            if [ -f /tmp/eid-auth-status ]; then
              STATUS="$(cat /tmp/eid-auth-status)"
              if [ "$STATUS" = "OFFERS_READ_OK" ]; then
                {
                  echo
                  echo "## Авторизация и чтение Money Storage"
                  echo
                  echo "Облачный браузер вернулся в аккаунт и успешно прочитал актуальные предложения из вкладки «Всем предлагают». Нормализованный снимок приложен отдельным артефактом."
                } >> "$GITHUB_STEP_SUMMARY"
                echo "Money Storage account redirect detected."
                exit 0
              fi
              if [ "$STATUS" = "OFFERS_READ_FAILED" ]; then
                echo "E-ID login completed but authenticated offer read failed. No retry was attempted."
                exit 1
              fi
              if [ "$STATUS" = "TIMEOUT_NOT_RETURNED_TO_ACCOUNT" ]; then
                {
                  echo
                  echo "## Авторизация Money Storage"
                  echo
                  echo "За время сессии браузер не вернулся на https://storage.money/account."
                  echo "Проверь страницу E-ID в удалённом браузере. Возможны незавершённая проверка, отказ или ошибка входа."
                } >> "$GITHUB_STEP_SUMMARY"
                echo "E-ID flow did not return to the account page."
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Browser session monitoring window ended."

      - name: Publish normalized current offers only
        if: success() && hashFiles('money-storage-current-offers.json') != ''
        uses: actions/upload-artifact@v5
        with:
          name: money-storage-current-offers
          path: money-storage-current-offers.json
          if-no-files-found: error
          retention-days: 1

      - name: Stop temporary browser services
        if: always()
        shell: bash
        run: |
          for file in /tmp/eid-browser.pid /tmp/websockify.pid /tmp/x11vnc.pid /tmp/xvfb.pid /tmp/cloudflared.pid; do
            if [ -f "$file" ]; then
              kill "$(cat "$file")" 2>/dev/null || true
            fi
          done
          rm -f /tmp/eid-vnc-password /tmp/eid-http-password
