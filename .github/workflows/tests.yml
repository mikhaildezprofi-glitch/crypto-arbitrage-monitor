name: tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cloud-only-*"
      - "feature/**"
      - "fix/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build cloud worker container
        run: docker build --tag crypto-arbitrage-monitor:test .

  cloudflare-worker-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - name: Resolve Cloudflare Python Worker dependencies
        run: uv sync
      - name: Compile Cloudflare Worker without deploying
        run: uv run pywrangler deploy --dry-run
      - name: Vendor shared core package into Worker bundle
        run: uv run python scripts/vendor_core.py
      - name: Test scheduled handler and D1 persistence locally
        shell: bash
        run: |
          printf 'MOCK_QUOTES=true\n' > .dev.vars
          uv run pywrangler d1 migrations apply crypto-arbitrage-monitor --local
          uv run pywrangler dev --test-scheduled --ip 127.0.0.1 --port 8787 > /tmp/cloudflare-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8787/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/cloudflare-worker.log
            exit 1
          fi
          if ! curl --silent --show-error --fail 'http://127.0.0.1:8787/cdn-cgi/local/scheduled?cron=*/5+*+*+*+*'; then
            echo "Scheduled handler returned an error. Wrangler/Worker log follows:"
            cat /tmp/cloudflare-worker.log
            exit 1
          fi
          if ! curl --silent --show-error --fail http://127.0.0.1:8787/health | python -c 'import json,sys; data=json.load(sys.stdin); sources={row["source"]: row["status"] for row in data["sources"]}; assert sources == {"blackbit":"fresh","winance":"fresh"}, sources; print("D1 smoke test passed:", sources)'; then
            echo "D1 health verification failed. Wrangler/Worker log follows:"
            cat /tmp/cloudflare-worker.log
            exit 1
          fi
