name: tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cloud-only-*"
      - "feature/**"
      - "fix/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build cloud worker container
        run: docker build --tag crypto-arbitrage-monitor:test .
