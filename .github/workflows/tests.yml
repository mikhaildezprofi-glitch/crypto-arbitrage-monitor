name: tests

on:
  workflow_dispatch:
  push:
    branches: [main, feat/money-storage-eid-cloudflare-state-machine-20261122, feat/integrated-arbitrage-automation-20261123]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify runner UTC clock against independent HTTPS time references
        run: python3 scripts/check_runner_clock.py
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
