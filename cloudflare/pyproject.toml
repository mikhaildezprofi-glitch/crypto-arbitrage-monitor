[project]
name = "crypto-arbitrage-monitor-cloudflare"
version = "0.1.0"
description = "Cloudflare Python Worker adapter for the read-only quote monitor"
requires-python = ">=3.13"
dependencies = [
    "crypto-arbitrage-monitor",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[tool.uv.sources]
crypto-arbitrage-monitor = { path = "../", editable = true }
